name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Repo files to www
        run: |
          mkdir -p www
          for f in *.html *.js *.json *.png *.pdf; do
            case "$f" in package.json|package-lock.json|capacitor.config.json) continue;; esac
            [ -f "$f" ] && cp "$f" www/ || true
          done
          cp mgr-9x2q.html www/index.html
          for f in www/index.html www/mgr-9x2q.html www/ia-ir.html; do
            [ -f "$f" ] && sed -i '0,/<head>/s//<head><script src="cap-shim.js"><\/script>/' "$f" || true
          done
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Memory and permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:largeHeap="true" android:usesCleartextTraffic="true"/' $M
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CALL_PHONE" />#' $M
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: STFFE-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
